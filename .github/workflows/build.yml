name: build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Quality and security gate on every push/PR.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri's Linux system dependencies (needed to compile the crate)
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: cargo fmt --all -- --check
        working-directory: src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # rkyv is an inactive optional feature of rust_decimal. It is present
          # in Cargo.lock but absent from the resolved feature graph.
          ignore: RUSTSEC-2026-0235

  # Full bundles: on main pushes → workflow artifacts; on v* tags → GitHub Release.
  bundle:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # Universal binary: one .dmg for both Apple Silicon and Intel
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Configure updater signing
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$UPDATER_PRIVATE_KEY" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for v* release tags."
            exit 1
          fi

          {
            echo 'TAURI_SIGNING_PRIVATE_KEY<<OMNIRAW_UPDATER_KEY'
            printf '%s\n' "$UPDATER_PRIVATE_KEY"
            echo 'OMNIRAW_UPDATER_KEY'
            echo 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<OMNIRAW_UPDATER_PASSWORD'
            printf '%s\n' "$UPDATER_PRIVATE_KEY_PASSWORD"
            echo 'OMNIRAW_UPDATER_PASSWORD'
          } >> "$GITHUB_ENV"

      - name: Configure Apple signing
        id: apple_signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_VALUE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_VALUE: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD_VALUE: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY_VALUE: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_VALUE: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_VALUE: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_VALUE: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          signing_values=(
            APPLE_CERTIFICATE_VALUE
            APPLE_CERTIFICATE_PASSWORD_VALUE
            KEYCHAIN_PASSWORD_VALUE
            APPLE_SIGNING_IDENTITY_VALUE
            APPLE_ID_VALUE
            APPLE_PASSWORD_VALUE
            APPLE_TEAM_ID_VALUE
          )

          configured=false
          missing=()
          for name in "${signing_values[@]}"; do
            if [[ -n "${!name}" ]]; then
              configured=true
            else
              missing+=("${name%_VALUE}")
            fi
          done

          if [[ "$configured" == 'false' ]]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Apple signing is partially configured. Missing: ${missing[*]}"
            exit 1
          fi

          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_VALUE"
            echo "APPLE_ID=$APPLE_ID_VALUE"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD_VALUE"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_VALUE"
          } >> "$GITHUB_ENV"
          echo 'configured=true' >> "$GITHUB_OUTPUT"

      - name: Import Apple Developer ID certificate
        if: steps.apple_signing.outputs.configured == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/omniraw-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/omniraw-signing.keychain-db"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # On tag pushes, create a GitHub Release with the bundles attached.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('OmniRaw {0}', github.ref_name) || '' }}
          args: ${{ matrix.args }} ${{ startsWith(github.ref, 'refs/tags/') && '--config src-tauri/tauri.release.conf.json' || '' }}

      - name: Smoke-test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REQUIRE_WINDOWS_SIGNING: ${{ secrets.WINDOWS_SIGNING_REQUIRED }}
        run: .github/scripts/smoke-windows.ps1

      - name: Smoke-test macOS disk image
        if: runner.os == 'macOS'
        env:
          REQUIRE_APPLE_SIGNING: ${{ steps.apple_signing.outputs.configured }}
        run: bash .github/scripts/smoke-macos.sh

      # For non-tag runs, expose the bundles as workflow artifacts.
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/macos/*.app.tar.gz
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/**/*.sig
          if-no-files-found: warn
